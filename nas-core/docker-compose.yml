version: '3.9'

services:
  mariadb:
    image: mariadb:11
    container_name: nas_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: CHANGE_ME
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: CHANGE_ME
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - nas_internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nas_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - nas_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  nextcloud:
    image: nextcloud:29-fpm-alpine
    container_name: nas_nextcloud
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mariadb
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: CHANGE_ME
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: CHANGE_ME
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      PHP_MEMORY_LIMIT: 1G
      PHP_UPLOAD_LIMIT: 10G
    volumes:
      - /opt/nas/nextcloud/config:/var/www/html/config
      - /opt/nas/data/nextcloud:/var/www/html/data
      - nextcloud_html:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep php-fpm | grep -v grep || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nas_internal

  nginx:
    image: nginx:alpine
    container_name: nas_nginx
    restart: unless-stopped
    depends_on:
       nextcloud:
          condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/nas/nginx/conf.d:/etc/nginx/conf.d:ro
      - /opt/nas/nginx/ssl:/etc/nginx/ssl:ro
      - /opt/nas/nginx/logs:/var/log/nginx
      - nextcloud_html:/var/www/html:ro
      - /opt/nas/data/nextcloud:/var/www/html/data:ro
    networks:
      - nas_internal

volumes:
  mariadb_data:
  redis_data:
  nextcloud_html:

networks:
  nas_internal:
    driver: bridge
